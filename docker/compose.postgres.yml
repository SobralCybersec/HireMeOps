services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: hiremeops
      POSTGRES_USER: hiremeops
      POSTGRES_PASSWORD: hiremeops-dev-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiremeops -d hiremeops"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - hiremeops-postgres:/var/lib/postgresql/data

volumes:
  hiremeops-postgres:
