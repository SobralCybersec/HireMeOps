# Build-speed config for `tauri dev`.
#
# The dominant cost in the edit → run loop is often linking the dev binary.
# Using LLVM's `lld` through clang can significantly reduce link times compared
# with the default GNU `bfd` linker.
#
# Requirements on Arch Linux:
#   sudo pacman -S clang lld
#
# If `mold` is installed instead:
#   sudo pacman -S mold
#
# you can replace:
#   -fuse-ld=lld
# with:
#   -fuse-ld=mold

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]