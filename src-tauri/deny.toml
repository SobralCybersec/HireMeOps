# cargo-deny policy for the Rust backend — checked in CI (security.yml).
# Covers what cargo-audit does NOT: license policy, dependency bans, source
# allow-listing. Advisories overlap with audit but are cheap to double-check.
# Run locally: cargo deny --manifest-path src-tauri/Cargo.toml check

[advisories]
version = 2
yanked = "deny"
# ignore = ["RUSTSEC-XXXX-XXXX"]  # add triaged IDs with a comment explaining why

[licenses]
version = 2
# Permissive licenses compatible with shipping an MIT app.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"  # a Tauri tree legitimately duplicates some crates
wildcards = "deny"          # no `*` version requirements

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
