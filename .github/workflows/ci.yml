name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  rust:
    name: Rust fmt · clippy · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Formatting is a compile-free gate — runs first, fails fast.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      # The lean default build must lint clean too (guards missing feature gates).
      - name: cargo clippy (lean)
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: cargo clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

  frontend:
    name: Frontend typecheck · lint · format · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  docker:
    name: Docker worker image builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: noble
            file: docker/Dockerfile.worker
          - variant: slim
            file: docker/Dockerfile.worker.slim
    steps:
      - uses: actions/checkout@v4

      # Catch shell bugs in the shared entrypoint before spending minutes on a build.
      # shellcheck ships preinstalled on ubuntu-latest runners. (Runs per-variant —
      # cheap, and keeps each matrix leg self-contained.)
      - name: shellcheck entrypoint
        run: shellcheck docker/entrypoint.sh

      - uses: docker/setup-buildx-action@v3

      # Building the image = the real "does it compile" gate: runs `npm install` +
      # `patchright install chromium` end to end. Per-variant gha cache keeps the
      # base image + chromium out of the download path on re-runs.
      - name: Build worker image (${{ matrix.variant }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          tags: hiremeops-worker:${{ matrix.variant }}
          load: true
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      # Smoke: the image is runnable and Node resolves patchright from /app.
      - name: Smoke — image runs (${{ matrix.variant }})
        run: |
          docker run --rm --entrypoint node hiremeops-worker:${{ matrix.variant }} \
            --input-type=module -e "import('patchright').then(() => console.log('patchright ok'))"
