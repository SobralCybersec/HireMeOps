name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions: {}

jobs:
  rust:
    name: Rust fmt · clippy · test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # tauri-build validates the bundle `resources` in tauri.conf.json even for
      # `cargo clippy`/`test` — `resources/node_modules` is git-ignored and only
      # created by prepare:playwright, so vendor it here or the build script aborts.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Vendor playwright resources
        working-directory: ${{ github.workspace }}
        run: |
          bun install --frozen-lockfile
          bun run prepare:playwright

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 2026-07-16
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      # Formatting is a compile-free gate — runs first, fails fast.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      # The lean default build must lint clean too (guards missing feature gates).
      - name: cargo clippy (lean)
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: cargo clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

  frontend:
    name: typecheck · lint · format · test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run agent:typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test

  postgres-integration:
    name: PostgreSQL 18 + pgvector integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: hiremeops
          POSTGRES_USER: hiremeops
          POSTGRES_PASSWORD: hiremeops-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiremeops -d hiremeops"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Vendor playwright resources
        working-directory: ${{ github.workspace }}
        run: |
          bun install --frozen-lockfile
          bun run prepare:playwright
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 2026-07-16
        with:
          toolchain: stable
      - name: Run empty-schema, FTS, vector, and constraint smoke
        env:
          HIREMEOPS_DATABASE_URL: postgres://hiremeops:hiremeops-ci@127.0.0.1:5432/hiremeops
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features postgres_schema_smoke

  docker:
    name: Docker worker image builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: noble
            file: docker/Dockerfile.worker
          - variant: slim
            file: docker/Dockerfile.worker.slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Catch shell bugs in the shared entrypoint before spending minutes on a build.
      # shellcheck ships preinstalled on ubuntu-latest runners. (Runs per-variant —
      # cheap, and keeps each matrix leg self-contained.)
      - name: shellcheck entrypoint
        run: shellcheck docker/entrypoint.sh

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Building the image = the real "does it compile" gate: runs `npm ci` +
      # `patchright install chromium` end to end. Per-variant gha cache keeps the
      # base image + chromium out of the download path on re-runs.
      - name: Build worker image (${{ matrix.variant }})
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          tags: hiremeops-worker:${{ matrix.variant }}
          load: true
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      # Smoke: the image is runnable and Node resolves patchright from /app.
      - name: Smoke — image runs (${{ matrix.variant }})
        run: |
          docker run --rm --entrypoint node hiremeops-worker:${{ matrix.variant }} \
            --input-type=module -e "import('patchright').then(() => console.log('patchright ok'))"
