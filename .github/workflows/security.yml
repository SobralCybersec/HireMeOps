# ============================================================
# HireMeOps — Security / supply-chain
# Push, PR, and weekly Monday 06:00 Lisbon re-scan.
# Jobs:
#   gitleaks      — secret / credential scanning (full history)
#   rust-audit    — cargo-audit (RustSec advisory DB)
#   cargo-deny    — advisories + license policy + bans + sources
#   osv-scan      — OSV-Scanner over pnpm + Cargo lockfiles → SARIF
#   license-check — MIT LICENSE present
# Every `uses:` SHA-pinned; SHAs verified 2026-08-04. gitleaks-action is v3
# (v2 runs on Node 20, which GitHub removes from runners 2026-09-16).
# ============================================================
name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  # ── 1. Secret scanning ────────────────────────────────────
  gitleaks:
    name: Secret scan (Gitleaks v3)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — gitleaks scans every commit
      # No GITLEAKS_LICENSE needed for a personal-account repo.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0

  # cargo-audit was removed — it's redundant with cargo-deny below (same RustSec
  # advisory DB). cargo-deny is the single tuned Rust-advisory gate.

  # ── 2. cargo-deny (advisories + licenses + bans + sources) ─
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories bans licenses sources

  # ── 3. OSV-Scanner — pnpm + Cargo lockfiles in one pass ────
  # The runnable action is the SUBDIRECTORY `osv-scanner-action` (the repo root
  # isn't a runnable action). Advisory (continue-on-error): the Cargo tree carries
  # unavoidable transitive advisories (gtk3/unic via Tauri's WebKitGTK backend, no
  # fixes upstream), so a hard gate would be permanently red. It still RUNS and
  # prints every finding to the log — check it for fixable JS advisories.
  osv-scan:
    name: OSV-Scanner (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          # automation/ has no lockfile → nothing to pin there yet.
          scan-args: |-
            --lockfile=./pnpm-lock.yaml
            --lockfile=./src-tauri/Cargo.lock

  # ── 5. License present ────────────────────────────────────
  license-check:
    name: MIT license present
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: LICENSE exists and references MIT
        run: |
          if [[ ! -f LICENSE ]]; then
            echo "::error::LICENSE not found"
            exit 1
          fi
          if ! grep -qi 'MIT' LICENSE; then
            echo "::error::LICENSE does not reference the MIT License"
            exit 1
          fi
          echo "License check passed ✓"
