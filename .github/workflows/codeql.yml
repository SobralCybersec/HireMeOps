# ============================================================
# HireMeOps — CodeQL (SAST for our own source)
# Inspects the JS/TS in the workspace and our GitHub Actions usage for
# security bugs. Results land under Security > Code scanning.
# Rust is intentionally OFF — CodeQL Rust is still public preview;
# Rust deps are covered by cargo-audit / cargo-deny / OSV in security.yml.
# Pinned to github/codeql-action v4.37.4.
#
# NOTE: CodeQL uploads results to GitHub code scanning, which a PRIVATE repo
# only has with GitHub Advanced Security. This repo is private without GHAS,
# so automatic push/PR/schedule runs would fail at the upload step. It's
# therefore MANUAL-ONLY (workflow_dispatch) for now.
# ============================================================

name: CodeQL

on:
  workflow_dispatch:
  # push:
  #   branches: [main, master]
  # pull_request:
  #   branches: [main, master]
  # schedule:
  #   - cron: "27 3 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43
        with:
          category: "/language:${{ matrix.language }}"