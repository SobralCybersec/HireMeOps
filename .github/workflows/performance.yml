# ============================================================
# HireMeOps — Performance (frontend bundle size)
# The script-parse/OS-detection benchmarks from the template don't map to a
# Tauri app. What's cheap AND meaningful here is FRONTEND BUNDLE SIZE — it
# ships in the app and regresses silently. No browser, no benchmarks.
#   PR                 → build + report total + largest chunks + soft threshold
#   weekly / dispatch  → same, as a trend snapshot
# ============================================================
name: Performance

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.*"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  bundle-size:
    name: Frontend bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # version comes from package.json "packageManager"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm build` = tsc && vite build → dist/. No Chromium/CDP compiled here.
      - name: Build frontend
        run: pnpm build

      - name: Report bundle size
        run: |
          {
            echo "## Frontend bundle"
            echo ""
            TOTAL_KB=$(du -sk dist | cut -f1)
            echo "**Total (uncompressed):** ${TOTAL_KB} KB"
            echo ""
            echo "| Largest JS/CSS chunks | Size |"
            echo "|---|---:|"
            find dist -type f \( -name '*.js' -o -name '*.css' \) -printf '%s\t%p\n' \
              | sort -rn | head -8 \
              | awk -F'\t' '{printf "| `%s` | %.1f KB |\n", $2, $1/1024}'
            echo ""
            echo "> Soft threshold: 5000 KB total (uncompressed)."
          } >> "$GITHUB_STEP_SUMMARY"

          TOTAL_KB=$(du -sk dist | cut -f1)
          if [ "$TOTAL_KB" -gt 5000 ]; then
            echo "::warning::Frontend bundle ${TOTAL_KB} KB exceeds the 5000 KB soft threshold"
          fi
          echo "Bundle total: ${TOTAL_KB} KB"
