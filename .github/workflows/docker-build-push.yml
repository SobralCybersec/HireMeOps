# ============================================================
# HireMeOps — Worker image: build · scan · publish
# Builds the OPTIONAL containerized automation worker (docker/Dockerfile.worker
# and .slim), scans it with Trivy (results → Security tab), and on push to the
# default branch publishes it to GHCR so users can `docker pull` instead of
# building locally.
#   PR        → build both variants + Trivy (no push)
#   push main → build + Trivy + push to ghcr.io/<owner>/hiremeops-worker
# trivy-action pinned to a POST-INCIDENT SHA (the v0.36.0 tag family was hijacked
# in March 2026); all `uses:` SHA-pinned, verified 2026-08-04.
# ============================================================
name: Worker Image

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io

concurrency:
  group: worker-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build:
    name: "${{ matrix.variant }} image"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # push to GHCR
      security-events: write # upload Trivy SARIF
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: noble
            file: docker/Dockerfile.worker
          - variant: slim
            file: docker/Dockerfile.worker.slim

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lowercase image name
        id: img
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ github.repository }}-worker' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.img.outputs.name }}
          # Per-variant tags; `latest` only for noble on the default branch.
          tags: |
            type=raw,value=${{ matrix.variant }}
            type=sha,prefix=${{ matrix.variant }}-
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch && matrix.variant == 'noble' }}
          labels: |
            org.opencontainers.image.title=HireMeOps Worker (${{ matrix.variant }})
            org.opencontainers.image.description=Containerized patchright automation worker for HireMeOps
            org.opencontainers.image.vendor=Matheus Sobral

      # Build into the local daemon so Trivy can scan the exact bits. gha cache
      # is shared with the push step below, so the second build is near-instant.
      - name: Build (load for scan)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          tags: hiremeops-worker:${{ matrix.variant }}-scan
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: hiremeops-worker:${{ matrix.variant }}-scan
          format: sarif
          output: trivy-${{ matrix.variant }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true # base-image CVEs Debian hasn't patched aren't actionable
          vuln-type: os,library

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: trivy-${{ matrix.variant }}.sarif
          category: trivy-${{ matrix.variant }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          provenance: true
          sbom: true
